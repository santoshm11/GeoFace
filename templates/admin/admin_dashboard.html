<!-- templates/admin/admin_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #eef1f5; padding: 20px; }
        .navbar { background: linear-gradient(145deg, #0d1b4a, #1a2a6c); border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .card-dash {
            background: #fff;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #1a2a6c;
            height: 100%;
            display: block;
        }
        .card-dash:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.2);
        }
        .card-dash i { font-size: 3.5rem; margin-bottom: 15px; color: #1a2a6c; }
        .card-dash .count { font-size: 2.5rem; font-weight: 700; }
        .card-dash .label { font-size: 1.1rem; color: #666; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-university"></i> Admin Panel</a>
            <div class="d-flex">
                <a href="{% url 'logout' %}" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4" style="color: #1a2a6c; font-weight: 700;">Admin Dashboard</h2>
        <div class="row g-4">
            <div class="col-md-3">
                <a href="{% url 'admin_student_list' %}" class="card-dash">
                    <i class="fas fa-user-graduate"></i>
                    <div class="count">{{ total_students }}</div>
                    <div class="label">Students</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'admin_teaching_list' %}" class="card-dash">
                    <i class="fas fa-chalkboard-teacher"></i>
                    <div class="count">{{ total_teaching }}</div>
                    <div class="label">Teaching Staff</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'admin_nonteaching_list' %}" class="card-dash">
                    <i class="fas fa-users-cog"></i>
                    <div class="count">{{ total_nonteaching }}</div>
                    <div class="label">Non-Teaching Staff</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'admin_register_choice' %}" class="card-dash" style="background: linear-gradient(145deg, #1a2a6c, #2d3e8f); color: #fff;">
                    <i class="fas fa-user-plus" style="color: #fff;"></i>
                    <div class="count" style="color: #fff;">+</div>
                    <div class="label" style="color: rgba(255,255,255,0.8);">New Registration</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'admin_holiday_calendar' %}" class="card-dash" style="background: linear-gradient(145deg, #e74c3c, #c0392b); color: #fff;">
                    <i class="fas fa-calendar-alt" style="color: #fff;"></i>
                    <div class="count" style="color: #fff;">📅</div>
                    <div class="label" style="color: rgba(255,255,255,0.8);">Manage Holidays</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
