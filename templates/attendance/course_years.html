<!-- templates/attendance/course_years.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.code }} - Years</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding: 20px; }
        .navbar { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); margin-bottom: 30px; border-radius: 10px; }
        .navbar-brand { color: white !important; font-weight: bold; }
        .nav-link { color: rgba(255,255,255,0.9) !important; }
        .year-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            height: 100%;
            text-decoration: none;
            color: #333;
            display: block;
        }
        .year-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            color: #1a237e;
        }
        .year-number {
            font-size: 4rem;
            font-weight: bold;
            color: #1a237e;
        }
        .year-label {
            font-size: 1.3rem;
            margin-top: 10px;
        }
        .course-header {
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'principal_dashboard' %}"><i class="fas fa-university"></i> College Attendance System</a>
            <div class="d-flex">
                <a href="{% url 'logout' %}" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">

        <div class="course-header">
            <h2>{{ course.code }} - {{ course.name }}</h2>
            <p class="mb-0">Duration: {{ course.duration_years }} Years | Type: {{ course.get_course_type_display }}</p>
        </div>

        <div class="row">
            {% for sem in semesters %}
            <div class="col-md-4 mb-4">
                <a href="{% url 'course_year_sections' course.id sem.number %}" class="year-card">
                    <div class="year-number">{{ sem.year }}</div>
                    <div class="year-label">{{ sem.label }}</div>
                    <small class="text-muted">Click to view sections</small>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
