<!-- templates/attendance/lecturer_history.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History - Lecturer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding: 20px; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; margin-bottom: 30px; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .card-dash {
            background: #fff;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
            text-decoration: none;
            color: #1a2a6c;
            display: block;
            height: 100%;
        }
        .card-dash:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.2);
        }
        .card-dash i { font-size: 3.5rem; margin-bottom: 15px; color: #667eea; }
        .card-dash .label { font-size: 1.2rem; font-weight: 600; }
        .card-dash .sub { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'lecturer_dashboard' %}"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <div class="d-flex">
                <a href="{% url 'logout' %}" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Attendance History</h2>
        <div class="row g-4">
            <div class="col-md-6">
                <a href="{% url 'lecturer_student_sessions' %}" class="card-dash">
                    <i class="fas fa-user-graduate"></i>
                    <div class="label">Student Attendance</div>
                    <div class="sub">View attendance records of students in your sessions</div>
                </a>
            </div>
            <div class="col-md-6">
                <a href="{% url 'lecturer_my_attendance' %}" class="card-dash">
                    <i class="fas fa-user-check"></i>
                    <div class="label">My Attendance</div>
                    <div class="sub">View your own self‑attendance history</div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
